<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VOLSTRA — Hesabım</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:Arial,sans-serif}
a{text-decoration:none;color:inherit}
button,input{font-family:inherit}
button{cursor:pointer}

header{
height:76px;
display:flex;align-items:center;justify-content:space-between;
padding:0 6%;background:#080808;border-bottom:1px solid #222
}
.logo{font-size:23px;font-weight:900;letter-spacing:6px}
.logo span{color:#666}
nav{display:flex;gap:28px}
nav a{color:#888;font-size:10px;font-weight:bold}
nav a:hover{color:#fff}

.page{max-width:1100px;margin:auto;padding:80px 5%}
.title small{color:#555;letter-spacing:3px;font-size:9px}
.title h1{font-size:52px;letter-spacing:-3px;margin:12px 0 45px}

.auth{
max-width:480px;
margin:auto;
background:#101010;
border:1px solid #252525;
padding:35px
}

.tabs{display:grid;grid-template-columns:1fr 1fr;margin-bottom:30px}
.tab{
height:45px;background:#080808;color:#777;
border:1px solid #292929;font-weight:bold;font-size:10px
}
.tab.active{background:#fff;color:#000}

.form{display:none}
.form.active{display:block}

.form h2{margin-bottom:8px}
.form p{color:#666;font-size:11px;line-height:1.7;margin-bottom:25px}

.field{margin-bottom:15px}
.field label{
display:block;color:#777;font-size:9px;
letter-spacing:1px;margin-bottom:7px
}
.field input{
width:100%;height:45px;
background:#080808;border:1px solid #333;
color:#fff;padding:0 12px;outline:none
}
.field input:focus{border-color:#fff}

.submit{
width:100%;height:48px;
background:#fff;color:#000;border:1px solid #fff;
font-size:10px;font-weight:bold;letter-spacing:1px
}
.submit:hover{background:#000;color:#fff}

.dashboard{display:none}
.dashboard.active{display:block}

.profile{
background:#101010;border:1px solid #222;
padding:30px;margin-bottom:20px;
display:flex;justify-content:space-between;align-items:center
}
.profile-name{font-size:25px;font-weight:bold}
.profile-email{color:#666;font-size:11px;margin-top:7px}

.logout{
background:#111;border:1px solid #333;color:#fff;
padding:11px 15px;font-size:9px;font-weight:bold
}
.logout:hover{background:#fff;color:#000}

.panel{
background:#101010;border:1px solid #222;
padding:28px;margin-bottom:20px
}
.panel h2{font-size:20px;margin-bottom:20px}

.order{
border-top:1px solid #242424;
padding:18px 0
}
.order:first-of-type{border-top:0}
.order-top{
display:flex;justify-content:space-between;
font-size:11px;font-weight:bold
}
.order-status{
display:inline-block;
margin-top:10px;
padding:6px 9px;
background:#fff;color:#000;
font-size:8px;font-weight:bold
}
.order-items{
color:#666;font-size:10px;line-height:1.8;margin-top:10px
}

.favorite{
display:flex;
justify-content:space-between;
align-items:center;
border-top:1px solid #242424;
padding:15px 0;
font-size:12px
}

.empty{color:#666;font-size:11px}

.shop{
display:inline-block;
margin-top:20px;
padding:14px 20px;
background:#fff;color:#000;
font-size:9px;font-weight:bold
}

@media(max-width:650px){
header{padding:0 4%}nav{display:none}
.page{padding:50px 5%}
.auth{padding:22px}
.profile{display:block}
.logout{margin-top:20px}
}
</style>
</head>

<body>

<header>
<a href="index.html" class="logo">VOLS<span>TRA</span></a>

<nav>
<a href="index.html">ANA SAYFA</a>
<a href="tshirts.html">TİŞÖRT</a>
<a href="shorts.html">ŞORT</a>
<a href="cart.html">SEPETİM</a>
</nav>
</header>

<main class="page">

<div class="title">
<small>VOLSTRA / ACCOUNT</small>
<h1>Hesabım.</h1>
</div>

<div id="authArea">

<div class="auth">

<div class="tabs">
<button class="tab active" onclick="showTab('login',this)">GİRİŞ YAP</button>
<button class="tab" onclick="showTab('register',this)">HESAP OLUŞTUR</button>
</div>

<div class="form active" id="login">
<h2>Tekrar hoş geldin.</h2>
<p>VOLSTRA hesabına giriş yap.</p>

<div class="field">
<label>E-POSTA</label>
<input id="loginEmail" type="email" placeholder="ornek@mail.com">
</div>

<div class="field">
<label>ŞİFRE</label>
<input id="loginPassword" type="password" placeholder="••••••••">
</div>

<button class="submit" onclick="login()">GİRİŞ YAP</button>
</div>

<div class="form" id="register">
<h2>VOLSTRA'ya katıl.</h2>
<p>Hesabını oluştur ve siparişlerini tek yerden takip et.</p>

<div class="field">
<label>AD</label>
<input id="regName" placeholder="Adın">
</div>

<div class="field">
<label>SOYAD</label>
<input id="regSurname" placeholder="Soyadın">
</div>

<div class="field">
<label>E-POSTA</label>
<input id="regEmail" type="email" placeholder="ornek@mail.com">
</div>

<div class="field">
<label>ŞİFRE</label>
<input id="regPassword" type="password" placeholder="Şifren">
</div>

<button class="submit" onclick="register()">HESAP OLUŞTUR</button>
</div>

</div>
</div>

<div class="dashboard" id="dashboard">

<div class="profile">
<div>
<div class="profile-name" id="profileName"></div>
<div class="profile-email" id="profileEmail"></div>
</div>

<button class="logout" onclick="logout()">ÇIKIŞ YAP</button>
</div>

<div class="panel">
<h2>📦 Siparişlerim</h2>
<div id="orders"></div>
</div>

<div class="panel">
<h2>❤️ Favorilerim</h2>
<div id="favorites"></div>
</div>

<a href="index.html" class="shop">ALIŞVERİŞE DEVAM ET →</a>

</div>

</main>

<script>

function showTab(id,button){
document.querySelectorAll(".form").forEach(x=>x.classList.remove("active"));
document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));

document.getElementById(id).classList.add("active");
button.classList.add("active");
}

function register(){

const name=document.getElementById("regName").value.trim();
const surname=document.getElementById("regSurname").value.trim();
const email=document.getElementById("regEmail").value.trim();
const password=document.getElementById("regPassword").value;

if(!name||!surname||!email||!password){
alert("Lütfen tüm alanları doldur.");
return;
}

if(password.length<4){
alert("Şifre en az 4 karakter olmalı.");
return;
}

const user={
name:name,
surname:surname,
email:email,
password:password
};

localStorage.setItem("volstraUser",JSON.stringify(user));

alert("Hesabın başarıyla oluşturuldu!");
showDashboard();
}

function login(){

const email=document.getElementById("loginEmail").value.trim();
const password=document.getElementById("loginPassword").value;

const user=JSON.parse(localStorage.getItem("volstraUser")||"null");

if(!user){
alert("Henüz hesabın yok. Önce hesap oluştur.");
return;
}

if(user.email!==email||user.password!==password){
alert("E-posta veya şifre yanlış.");
return;
}

alert("Giriş başarılı!");
showDashboard();
}

function logout(){
localStorage.removeItem("volstraUser");
location.reload();
}

function showDashboard(){

const user=JSON.parse(localStorage.getItem("volstraUser")||"null");

if(!user)return;

document.getElementById("authArea").style.display="none";
document.getElementById("dashboard").classList.add("active");

document.getElementById("profileName").textContent=
user.name+" "+user.surname;

document.getElementById("profileEmail").textContent=user.email;

loadOrders();
loadFavorites();
}

function loadOrders(){

const orders=JSON.parse(localStorage.getItem("volstraOrders")||"[]");
const box=document.getElementById("orders");

if(!orders.length){
box.innerHTML=`<div class="empty">Henüz bir siparişin bulunmuyor.</div>`;
return;
}

box.innerHTML=orders.map(order=>{

const products=order.items.map(x=>
`${x.name} — ${x.size} / ${x.color} × ${x.qty}`
).join("<br>");

return `
<div class="order">

<div class="order-top">
<span>#${order.id}</span>
<span>₺${Number(order.total).toLocaleString("tr-TR")}</span>
</div>

<div class="order-status">${order.status}</div>

<div class="order-items">
${products}
<br>
Sipariş tarihi: ${order.date}
</div>

</div>
`;

}).join("");
}

function loadFavorites(){

const fav=JSON.parse(localStorage.getItem("volstraFavorites")||"[]");
const box=document.getElementById("favorites");

if(!fav.length){
box.innerHTML=`<div class="empty">Henüz favori ürünün yok.</div>`;
return;
}

box.innerHTML=fav.map(x=>`
<div class="favorite">
<span>♡ ${x}</span>
<span>VOLSTRA</span>
</div>
`).join("");
}

if(localStorage.getItem("volstraUser")){
showDashboard();
}

</script>

</body>
</html>
