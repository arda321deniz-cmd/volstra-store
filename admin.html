```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VOLSTRA — Admin Panel</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    color:#fff;
    font-family:Arial,sans-serif;
}

button,input,select{
    font-family:inherit;
}

header{
    height:75px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    background:#080808;
    border-bottom:1px solid #222;
    position:sticky;
    top:0;
    z-index:20;
}

.logo{
    font-size:23px;
    font-weight:900;
    letter-spacing:6px;
}

.logo span{
    color:#666;
}

.admin-badge{
    padding:8px 12px;
    border:1px solid #333;
    color:#aaa;
    font-size:9px;
    letter-spacing:2px;
}

.page{
    max-width:1400px;
    margin:auto;
    padding:55px 6%;
}

.heading{
    margin-bottom:35px;
}

.heading small{
    color:#555;
    font-size:9px;
    letter-spacing:3px;
}

.heading h1{
    font-size:48px;
    margin-top:10px;
    letter-spacing:-2px;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:35px;
}

.stat{
    background:#101010;
    border:1px solid #222;
    padding:24px;
}

.stat span{
    display:block;
    color:#666;
    font-size:9px;
    letter-spacing:2px;
    margin-bottom:12px;
}

.stat strong{
    font-size:27px;
}

/* TOOLBAR */

.toolbar{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.search{
    flex:1;
    height:45px;
    background:#0d0d0d;
    border:1px solid #292929;
    color:#fff;
    padding:0 15px;
    outline:none;
}

.search:focus{
    border-color:#666;
}

.refresh{
    height:45px;
    padding:0 20px;
    border:1px solid #fff;
    background:#fff;
    color:#000;
    font-weight:bold;
    font-size:10px;
    cursor:pointer;
}

/* ORDERS */

.orders{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.order{
    background:#0d0d0d;
    border:1px solid #222;
    padding:25px;
}

.order-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    padding-bottom:20px;
    border-bottom:1px solid #222;
}

.order-number{
    font-size:15px;
    font-weight:bold;
}

.date{
    color:#555;
    font-size:10px;
    margin-top:7px;
}

.status{
    padding:8px 12px;
    border:1px solid #333;
    background:#151515;
    color:#fff;
    font-size:9px;
    font-weight:bold;
}

/* CUSTOMER */

.customer{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    padding:22px 0;
}

.info-box{
    background:#090909;
    border:1px solid #1c1c1c;
    padding:15px;
}

.info-box small{
    display:block;
    color:#555;
    font-size:8px;
    letter-spacing:2px;
    margin-bottom:8px;
}

.info-box div{
    font-size:12px;
    line-height:1.5;
}

/* PRODUCTS */

.order-products{
    border-top:1px solid #222;
    padding-top:20px;
}

.order-products h3{
    font-size:11px;
    letter-spacing:2px;
    margin-bottom:15px;
}

.product{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:13px 0;
    border-bottom:1px solid #181818;
}

.product-name{
    font-size:12px;
    font-weight:bold;
}

.product-meta{
    color:#666;
    font-size:9px;
    margin-top:5px;
}

.product-price{
    font-weight:bold;
    font-size:12px;
}

/* BOTTOM */

.order-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:20px;
}

.total{
    font-size:18px;
    font-weight:bold;
}

.status-select{
    height:38px;
    background:#080808;
    color:#fff;
    border:1px solid #333;
    padding:0 12px;
    outline:none;
}

.delete{
    height:38px;
    padding:0 15px;
    margin-left:7px;
    background:#111;
    color:#888;
    border:1px solid #333;
    cursor:pointer;
}

.delete:hover{
    background:#fff;
    color:#000;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:90px 20px;
    border:1px solid #222;
    background:#0c0c0c;
}

.empty h2{
    margin-bottom:10px;
}

.empty p{
    color:#555;
    font-size:12px;
}

/* MOBILE */

@media(max-width:900px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .customer{
        grid-template-columns:1fr;
    }

}

@media(max-width:600px){

    header{
        padding:0 5%;
    }

    .page{
        padding:40px 5%;
    }

    .heading h1{
        font-size:38px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .stat{
        padding:17px;
    }

    .stat strong{
        font-size:21px;
    }

    .order{
        padding:16px;
    }

    .order-top{
        align-items:flex-start;
        flex-direction:column;
    }

    .order-bottom{
        align-items:flex-start;
        flex-direction:column;
        gap:15px;
    }

    .toolbar{
        flex-direction:column;
    }

}
</style>
</head>

<body>

<header>

    <div class="logo">
        VOLS<span>TRA</span>
    </div>

    <div class="admin-badge">
        ADMIN PANEL
    </div>

</header>


<main class="page">

    <div class="heading">
        <small>VOLSTRA / MANAGEMENT</small>
        <h1>Siparişler.</h1>
    </div>


    <div class="stats">

        <div class="stat">
            <span>TOPLAM SİPARİŞ</span>
            <strong id="totalOrders">0</strong>
        </div>

        <div class="stat">
            <span>TOPLAM SATIŞ</span>
            <strong id="totalSales">₺0</strong>
        </div>

        <div class="stat">
            <span>HAZIRLANIYOR</span>
            <strong id="preparing">0</strong>
        </div>

        <div class="stat">
            <span>KARGODA</span>
            <strong id="shipping">0</strong>
        </div>

    </div>


    <div class="toolbar">

        <input
            class="search"
            id="search"
            placeholder="Sipariş no, müşteri adı veya telefon ara..."
            oninput="render()"
        >

        <button class="refresh" onclick="render()">
            YENİLE
        </button>

    </div>


    <div id="orders" class="orders"></div>

</main>


<script>

function getOrders(){

    return JSON.parse(
        localStorage.getItem("volstraOrders") || "[]"
    );

}


function saveOrders(orders){

    localStorage.setItem(
        "volstraOrders",
        JSON.stringify(orders)
    );

}


function money(number){

    return Number(number || 0).toLocaleString("tr-TR");

}


function updateStatus(index,value){

    let orders=getOrders();

    orders[index].status=value;

    saveOrders(orders);

    render();

}


function deleteOrder(index){

    if(!confirm("Bu siparişi silmek istediğine emin misin?")){
        return;
    }

    let orders=getOrders();

    orders.splice(index,1);

    saveOrders(orders);

    render();

}


function render(){

    let orders=getOrders();

    let search=
        document.getElementById("search").value
        .toLowerCase()
        .trim();


    let totalSales=0;

    let preparing=0;

    let shipping=0;


    orders.forEach(order=>{

        totalSales+=Number(order.total || 0);

        if(order.status==="Hazırlanıyor"){
            preparing++;
        }

        if(order.status==="Kargoya verildi"){
            shipping++;
        }

    });


    document.getElementById("totalOrders").textContent=
        orders.length;

    document.getElementById("totalSales").textContent=
        "₺"+money(totalSales);

    document.getElementById("preparing").textContent=
        preparing;

    document.getElementById("shipping").textContent=
        shipping;


    let filtered=orders.filter(order=>{

        let customer=order.customer || order.user || {};

        let text=(
            order.id+" "+
            order.date+" "+
            (customer.name || "")+" "+
            (customer.surname || "")+" "+
            (customer.phone || "")
        ).toLowerCase();

        return text.includes(search);

    });


    let container=document.getElementById("orders");


    if(filtered.length===0){

        container.innerHTML=`
            <div class="empty">
                <h2>Sipariş bulunamadı.</h2>
                <p>Henüz bu kriterlere uygun bir sipariş yok.</p>
            </div>
        `;

        return;

    }


    container.innerHTML=filtered.map((order)=>{

        let originalIndex=orders.indexOf(order);

        let customer=order.customer || order.user || {};

        let fullName=(
            customer.name ||
            customer.surname
        )
        ?
        `${customer.name || ""} ${customer.surname || ""}`
        :
        "Müşteri bilgisi yok";


        let phone=customer.phone || "Belirtilmemiş";

        let address=customer.address || "Adres belirtilmemiş";

        let city=customer.city || "";

        let district=customer.district || "";


        let products=(order.items || []).map(item=>`

            <div class="product">

                <div>

                    <div class="product-name">
                        ${item.name || "Ürün"}
                    </div>

                    <div class="product-meta">
                        Beden: ${item.size || "-"}
                        &nbsp; • &nbsp;
                        Renk: ${item.color || "-"}
                        &nbsp; • &nbsp;
                        Adet: ${item.qty || 1}
                    </div>

                </div>

                <div class="product-price">
                    ₺${money(
                        Number(item.price || 0) *
                        Number(item.qty || 1)
                    )}
                </div>

            </div>

        `).join("");


        return`

            <div class="order">

                <div class="order-top">

                    <div>

                        <div class="order-number">
                            ${order.id || "VOL-?????"}
                        </div>

                        <div class="date">
                            ${order.date || "Tarih yok"}
                        </div>

                    </div>


                    <div class="status">
                        ${order.status || "Sipariş alındı"}
                    </div>

                </div>


                <div class="customer">

                    <div class="info-box">

                        <small>MÜŞTERİ</small>

                        <div>
                            ${fullName}
                        </div>

                    </div>


                    <div class="info-box">

                        <small>TELEFON</small>

                        <div>
                            ${phone}
                        </div>

                    </div>


                    <div class="info-box">

                        <small>ADRES</small>

                        <div>
                            ${address}
                            ${district ? "<br>"+district : ""}
                            ${city ? "<br>"+city : ""}
                        </div>

                    </div>

                </div>


                <div class="order-products">

                    <h3>ÜRÜNLER</h3>

                    ${products}

                </div>


                <div class="order-bottom">

                    <div class="total">
                        ₺${money(order.total)}
                    </div>


                    <div>

                        <select
                            class="status-select"
                            onchange="updateStatus(${originalIndex},this.value)"
                        >

                            <option ${order.status==="Sipariş alındı" ? "selected":""}>
                                Sipariş alındı
                            </option>

                            <option ${order.status==="Hazırlanıyor" ? "selected":""}>
                                Hazırlanıyor
                            </option>

                            <option ${order.status==="Kargoya verildi" ? "selected":""}>
                                Kargoya verildi
                            </option>

                            <option ${order.status==="Teslim edildi" ? "selected":""}>
                                Teslim edildi
                            </option>

                        </select>


                        <button
                            class="delete"
                            onclick="deleteOrder(${originalIndex})"
                        >
                            SİL
                        </button>

                    </div>

                </div>

            </div>

        `;

    }).join("");

}


render();

</script>

</body>
</html>
```
